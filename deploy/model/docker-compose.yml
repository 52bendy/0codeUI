# InTimeUI 模型推理服务（24GB 显存参考部署）
#
# 默认：Qwen2.5-Coder-7B-Instruct-AWQ，OpenAI 兼容接口仅监听 127.0.0.1:8000。
# 启动：
#   docker compose -f deploy/model/docker-compose.yml up -d
# 查看：
#   curl -s http://127.0.0.1:8000/v1/models
#
# 切换模型（示例）：
#   MODEL_ID=Qwen/Qwen2.5-Coder-14B-Instruct-AWQ \
#   SERVED_MODEL_NAME=Qwen2.5-Coder-14B-Instruct-AWQ \
#   docker compose -f deploy/model/docker-compose.yml up -d
#
# 注意：推理服务不要直接暴露公网；由 intimeui-server 在内网调用，
# TLS 与鉴权在反向代理 / API 网关层终止。

services:
  model:
    image: vllm/vllm-openai:v0.8.5
    container_name: intimeui-model
    restart: unless-stopped
    ipc: host
    shm_size: "2gb"
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      HF_HUB_ENABLE_HF_TRANSFER: "1"
    volumes:
      - hf-cache:/root/.cache/huggingface
    command:
      - --model
      - ${MODEL_ID:-Qwen/Qwen2.5-Coder-7B-Instruct-AWQ}
      - --served-model-name
      - ${SERVED_MODEL_NAME:-Qwen2.5-Coder-7B-Instruct-AWQ}
      - --quantization
      - ${QUANTIZATION:-awq}
      - --dtype
      - half
      - --max-model-len
      - "8192"
      - --gpu-memory-utilization
      - "0.90"
      - --max-num-seqs
      - "8"
      - --enable-prefix-caching
      - --disable-log-requests
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 180s
    ulimits:
      memlock:
        soft: -1
        hard: -1

volumes:
  hf-cache:
